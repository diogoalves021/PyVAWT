turbine:
    radius_mode: manual       # Options: auto or manual
    r: 3.0                    # Used if radius_mode == manual
    H: 3.0                    # Used if radius_mode == auto
    twist: 0.0
    delta: 0.0
    chord:
    - 0.25
    B: 3
    solidity:
    - 0.125
    centerX: 0
    centerY: 0
    Omega: 5.03
    ntheta: 36
environment:
    Vinf:
    - 5.0
    rho: 1.225
    mu: 1.7894e-05
simulation:
    fixed_parameter: omega    # "omega" or "vinf"
    num_turbines: 1
    airfoil:
    - naca0021
    Re: 200000
    Mach: 0.3
    include_360_deg_effects: false

output:
  save: true               
  save_config: true        
  save_plot: true          

  data_file:
    format: "dat"          # "dat" or "csv"
    include_header: true   

  plot_image:
    format: "png"          # "png" or "eps"
    dpi: 300               

