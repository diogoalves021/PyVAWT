# ==============================================================================
# PyVAWT Configuration File for Single Turbine
# ==============================================================================

turbine:
  r: 35.0                  # Rotor radius (m) - Verify if your solver expects radius or diameter
  H: 1.0                   # Rotor height (m)
  twist: 0.0               # Blade twist angle (deg)
  delta: 0.0               # Blade pitch/offset angle (deg)
  chord:
  - 1.75            # Chord line length (m)
  B: 2                     # Number of blades
  solidity: 
  - 0.1          # Solidity (calculated based on rotor dimensions)
  centerX: 0.0             # X-coordinate of the turbine center (m)
  centerY: 0.0             # Y-coordinate of the turbine center (m)
  Omega: 1.427             # Rotational speed (rad/s)
  ntheta: 36               # Number of angular/azimuthal steps

environment:
  Vinf: 
  - 6.23             # Free-stream velocity (m/s) - Varied in Sanvito's experiment
  rho: 1.225               # Fluid density (kg/m3)
  mu: 1.7894e-05           # Dynamic viscosity (Pa*s)

solver:
  tsr:
    min: 4.0
    max: 7.0
    n_points: 10

  method: neuralfoil     # "neuralfoil" or "file". It's the way the cl and cd is obtained.
  fixed_parameter: vinf # "omega" or "vinf"
  
  neuralfoil:
    airfoil: 
    - naca0018  # Airfoil profile designated for the simulation
    model_size: large    # "xxsmall"	"xsmall"	"small"	"medium"	"large"	"xlarge"	"xxlarge"	"xxxlarge"
    
  file:
    path: src/data/experimental/NACA_0012_mod.dat # Path to polar data file

  simulation3d:
    enabled: true          # Enable 3D effects/domain simulation

    settings:              # [Active only if enabled = true]
      height: 3.0            # Total height of the 3D domain (m)
      vertical_layers: 3     # Number of vertical grid divisions for cylinder discretization
      discretization_power: 2 # Vertical grid spacing law: 1 = linear, 2 = power law (nodes concentrated at top)
      velocity_profile: power_law # Atmospheric wind profile model: 'constant' or 'power_law'

submodels:
  tip_loss: true          # Account for tip loss effects (true/false)
  dynamic_stall: true      # Enable dynamic stall modeling (true/false)

  flow_curvature:
    enabled: true         # "true" or "false"
    normalized_hook_point: 0.1 # Reference point along the chord (0.0 = leading edge)

output:
  save: true               # Save simulation results
  save_config: true        # Save a copy of this configuration file with the results
  save_plot: true          # Generate and save output plots
  data_file:
    format: dat          # "dat" or "csv"
    include_header: true   # Include column headers in the output file
  plot_image:
    format: png          # "png" or "eps"
    dpi: 300               # Image resolution (Dots Per Inch)

  cp_theta:
    enabled: true            # Habilita/Desabilita o processamento de Cp(theta)
    target_tsr: 2.58         # TSR alvo para extração da curva azimutal
    tolerance: 0.7          # Tolerância de busca para encontrar o TSR
    save_data: true          # Salva o arquivo cp_theta_distribution.dat
    save_plot: true          # Salva a imagem do gráfico Cp x Theta
