turbine:
  radius_mode: manual #"manual" or "auto"
  r: 35.0
  H: 1.0
  twist: 0.0
  delta: 0.0
  chord:
  - 1.75
  B: 2
  solidity:
  - 0.1
  centerX: 0
  centerY: 0
  Omega: 1.427
  ntheta: 36
environment:
  Vinf:
  - 6.23
  rho: 1.225
  mu: 1.7894e-05
simulation:
  fixed_parameter: vinf # "omega" or "vinf"
  num_turbines: 1
  airfoil:
  - naca0018
  Re: 300000
  Mach: 0.3
  include_360_deg_effects: false
  var_omega_vinf: 1
aero:
  method: neuralfoil  # "neuralfoil" or "file"
  model_size: large # "xxsmall"	"xsmall"	"small"	"medium"	"large"	"xlarge"	"xxlarge"	"xxxlarge"
  file: src/data/experimental/NACA_0012_mod.dat  # only used if method = file
output:
  save: true
  save_config: true
  save_plot: true
  data_file:
    format: dat # "dat" or "csv"
    include_header: true
  plot_image:
    format: png # "png" or "eps"
    dpi: 300
flow_curvature:
  enabled: false          # "true" or "false"
  normalized_hook_point: 0.0
