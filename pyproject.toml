[project]
name = "pyvawt"
version = "0.4.0"
description = "Simulation of vertical-axis wind turbines using the actuator cylinder method."
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
dependencies = [
    "aerosandbox>=4.2.8",
    "h5py>=3.13.0",
    "matplotlib>=3.10.1",
    "numpy>=2.2.4",
    "pandas>=2.2.3",
    "pyyaml>=6.0.2",
    "rich>=14.0.0",
    "scipy>=1.15.2",
    "typing>=3.10.0.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["pyvawt"]
